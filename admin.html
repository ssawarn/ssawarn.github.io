<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="robots" content="noindex, nofollow"> <title>·</title> <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}.login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:360px}.login-card h2{font-size:1rem;font-weight:600;margin-bottom:1.5rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.login-card input[type="password"]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.6rem .9rem;font-size:14px;outline:0;transition:border-color .15s;margin-bottom:.9rem;font-family:monospace;letter-spacing:.05em}.login-card input[type="password"]:focus{border-color:var(--accent)}.btn-primary{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:.55rem 1.1rem;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}.btn-primary:hover:not(:disabled){opacity:.85}.btn-primary:disabled{opacity:.55;cursor:default}.btn-primary.block{width:100%;text-align:center}.btn-ghost{display:inline-block;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:.45rem .9rem;font-size:13px;cursor:pointer;transition:color .15s,border-color .15s}.btn-ghost:hover{color:var(--text);border-color:var(--muted)}#login-error{color:var(--red);font-size:13px;margin-top:.75rem}.login-hint{margin-top:1.25rem;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:1rem}.login-hint a{color:var(--accent);text-decoration:none}.login-hint a:hover{text-decoration:underline}code{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:11px}#admin-panel{max-width:1200px;margin:0 auto;padding:1.25rem 1.25rem 3rem}.admin-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}.admin-header h1{font-size:1.1rem;font-weight:600;flex:1;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.tab-nav{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem}.tab-btn{background:transparent;border:0;border-bottom:2px solid transparent;padding:.6rem 1rem;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s;margin-bottom:-1px}.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.toolbar{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}#search-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.45rem .9rem;font-size:13px;outline:0;width:240px;max-width:100%;transition:border-color .15s}#search-input:focus{border-color:var(--accent)}#record-count{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:500px}thead th{background:var(--surface);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:.65rem 1rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}tbody tr{border-bottom:1px solid var(--border);transition:background .1s}tbody tr:last-child{border-bottom:0}tbody tr:hover{background:rgba(88,166,255,0.05)}tbody td{padding:.7rem 1rem;vertical-align:middle}tbody td a{color:var(--accent);text-decoration:none}tbody td a:hover{text-decoration:underline}.td-date{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}.td-notes{color:var(--muted);font-size:13px;max-width:180px}.td-actions{white-space:nowrap;text-align:right}.btn-edit,.btn-del{border-radius:5px;padding:.2rem .55rem;font-size:13px;cursor:pointer;background:transparent;transition:background .15s;margin-left:.25rem}.btn-edit{color:var(--accent);border:1px solid var(--accent)}.btn-edit:hover{background:rgba(88,166,255,0.1)}.btn-del{color:var(--red);border:1px solid var(--red)}.btn-del:hover{background:rgba(248,81,73,0.1)}.empty-msg{text-align:center;padding:2.5rem 1rem;color:var(--muted)}#status-bar{margin-top:.75rem;font-size:12px;color:var(--muted);min-height:18px}.status-ok{color:var(--green)}.status-error{color:var(--red)}#record-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;padding:1rem}.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.modal-card h3{font-size:1rem;font-weight:600;margin-bottom:1.25rem}

t"></span> <button id="add-btn" class="btn-primary">+ Add</button> </div> <div class="table-wrap"> <table> <thead id="table-head"></thead> <tbody id="table-body"></tbody> </table> </div> <div id="status-bar"></div> </div> <div id="record-modal"> <div class="modal-card"> <h3 id="modal-title"></h3> <form id="record-form" autocomplete="off" novalidate> <div class="modal-actions"> <button type="button" id="modal-cancel" class="btn-ghost">Cancel</button> <button type="submit" class="btn-primary">Save</button> </div> </form> </div> </div> <script src="/assets/js/admin.js"></script> </body> </html>
